
name: Laravel Development CI/CD

on:
  push:
    branches:
      - development

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laravel-development-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Laravel to EC2
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout latest code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Install RSYNC
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync openssh-client

      # 3. Configure SSH
      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # 4. Test SSH connection
      - name: Test EC2 Connection
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            'echo "EC2 SSH connection successful"'

      # 5. Deploy Laravel files using RSYNC
      - name: Upload Laravel Code
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          rsync -avz \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='vendor/' \
            --exclude='node_modules/' \
            --exclude='storage/' \
            --exclude='bootstrap/cache/' \
            -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            ./ \
            "$EC2_USER@$EC2_HOST:/var/www/foodhub/"
      # 6. Prepare Laravel directories
      - name: Prepare Laravel Directories
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            'cd /var/www/foodhub &&
             mkdir -p storage/framework/cache/data &&
             mkdir -p storage/framework/sessions &&
             mkdir -p storage/framework/views &&
             mkdir -p storage/logs &&
             mkdir -p bootstrap/cache &&
             chmod -R 775 storage bootstrap/cache'
      # 7. Install Composer dependencies
      - name: Composer Install
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            'cd /var/www/foodhub && composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader'

      # 8. Run Laravel migrations
      - name: Run Database Migrations
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            'cd /var/www/foodhub && php artisan migrate --force'

      # 9. Clear Laravel caches
      - name: Clear Laravel Cache
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            'cd /var/www/foodhub && php artisan optimize:clear'

      # 10. Create storage link if missing
      - name: Create Storage Link
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            'cd /var/www/foodhub && if [ ! -L public/storage ]; then php artisan storage:link; fi'

      # 11. Optimize Laravel
      - name: Optimize Laravel
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            'cd /var/www/foodhub && php artisan config:cache && php artisan view:cache'

      # 12. Deployment completed
      - name: Deployment Success
        run: |
          echo "Laravel deployment completed successfully!"
